name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.66.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf bindings
        run: |
          buf generate buf.build/agynio/api \
            --include-imports \
            --path agynio/api/agents/v1 \
            --path agynio/api/runner/v1 \
            --path agynio/api/runners/v1 \
            --path agynio/api/identity/v1 \
            --path agynio/api/authorization/v1 \
            --path agynio/api/ziti_management/v1 \
            --path agynio/api/notifications/v1

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
