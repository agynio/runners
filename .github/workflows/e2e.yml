name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@main
        with:
          ref: de8f5b68db4c17a5e41152aa6f8dde8b38de4812

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Install gRPC health probe
        run: |
          set -euo pipefail
          version="v0.4.38"
          curl -fsSL --retry 3 --retry-delay 5 \
            -o /tmp/grpc_health_probe \
            "https://github.com/grpc-ecosystem/grpc-health-probe/releases/download/${version}/grpc_health_probe-linux-amd64"
          sudo install -c -m 0755 /tmp/grpc_health_probe /usr/local/bin/grpc_health_probe
          grpc_health_probe -version

      - name: Deploy runners from source
        run: |
          set -euo pipefail
          RUNNER_TRACKING_ID="" devspace dev --watch > /tmp/runners-devspace.log 2>&1 &
          echo "$!" > /tmp/runners-devspace.pid
          devspace run-pipeline wait-runners

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@noa/fix-go-core-runners-llm-helpers
        with:
          service: runners
          include_smoke: "false"
          e2e-ref: noa/fix-go-core-runners-llm-helpers

      - name: Restore ArgoCD sync
        if: always()
        run: |
          set +e
          if [ -f /tmp/runners-devspace.pid ]; then
            kill "$(cat /tmp/runners-devspace.pid)"
            wait "$(cat /tmp/runners-devspace.pid)" || true
          fi
          if command -v devspace >/dev/null 2>&1; then
            devspace run-pipeline restore-argocd
          else
            echo "DevSpace is not installed; skipping ArgoCD sync restore."
          fi
