{{- if .Values.authorizationPolicy.enabled }}
{{- $orchestratorNamespace := .Values.authorizationPolicy.orchestratorServiceAccount.namespace | default .Release.Namespace }}
{{- $orchestratorName := .Values.authorizationPolicy.orchestratorServiceAccount.name }}
{{- $orchestratorPrincipal := printf "cluster.local/ns/%s/sa/%s" $orchestratorNamespace $orchestratorName }}
{{- $identityServiceAccounts := .Values.authorizationPolicy.identityServiceAccounts | default list }}
{{- $identityPrincipals := list $orchestratorPrincipal }}
{{- range $identityServiceAccounts }}
{{- $identityNamespace := .namespace | default $.Release.Namespace }}
{{- $identityPrincipals = append $identityPrincipals (printf "cluster.local/ns/%s/sa/%s" $identityNamespace .name) }}
{{- end }}
{{- $terminalProxyName := "" }}
{{- $terminalProxyNamespace := .Release.Namespace }}
{{- with .Values.authorizationPolicy.terminalProxyServiceAccount }}
{{- $terminalProxyName = .name | default "" }}
{{- $terminalProxyNamespace = .namespace | default $.Release.Namespace }}
{{- end }}
{{- $terminalProxyPrincipals := list }}
{{- if $terminalProxyName }}
{{- $terminalProxyPrincipals = append $terminalProxyPrincipals (printf "cluster.local/ns/%s/sa/%s" $terminalProxyNamespace $terminalProxyName) }}
{{- end }}
{{- $gatewayPaths := list "/agynio.api.runners.v1.RunnersService/RegisterRunner" "/agynio.api.runners.v1.RunnersService/GetRunner" "/agynio.api.runners.v1.RunnersService/ListRunners" "/agynio.api.runners.v1.RunnersService/UpdateRunner" "/agynio.api.runners.v1.RunnersService/DeleteRunner" "/agynio.api.runners.v1.RunnersService/GetWorkload" "/agynio.api.runners.v1.RunnersService/ListWorkloadsByThread" "/agynio.api.runners.v1.RunnersService/ListWorkloads" "/agynio.api.runners.v1.RunnersService/TouchWorkload" "/agynio.api.runners.v1.RunnersService/StreamWorkloadLogs" "/agynio.api.runners.v1.RunnersService/GetVolume" "/agynio.api.runners.v1.RunnersService/ListVolumes" "/agynio.api.runners.v1.RunnersService/ListVolumesByThread" }}
{{- $orchestratorPaths := list "/agynio.api.runners.v1.RunnersService/CreateWorkload" "/agynio.api.runners.v1.RunnersService/UpdateWorkload" "/agynio.api.runners.v1.RunnersService/UpdateWorkloadStatus" "/agynio.api.runners.v1.RunnersService/DeleteWorkload" "/agynio.api.runners.v1.RunnersService/BatchUpdateWorkloadSampledAt" "/agynio.api.runners.v1.RunnersService/CreateVolume" "/agynio.api.runners.v1.RunnersService/UpdateVolume" "/agynio.api.runners.v1.RunnersService/BatchUpdateVolumeSampledAt" }}
{{- /*
  Gateway paths the Terminal Proxy calls internally, carrying no identity:
  GetWorkload to resolve the runner hosting a workload, and TouchWorkload to
  report attached sandbox terminal session activity. Both happen after the
  proxy validated its own terminal ticket, so there is no end-user identity to
  forward. These two paths are split out of $gatewayPaths so the terminal-proxy
  principal is exempted from the identity-required rule on them alone: every
  other gateway principal still needs x-identity-id on them, and terminal-proxy
  still needs it on every other gateway path.
*/}}
{{- $terminalProxyPaths := list "/agynio.api.runners.v1.RunnersService/GetWorkload" "/agynio.api.runners.v1.RunnersService/TouchWorkload" }}
{{- $organizationsNamespace := .Values.authorizationPolicy.organizationsServiceAccount.namespace | default .Release.Namespace }}
{{- $organizationsPrincipal := printf "cluster.local/ns/%s/sa/%s" $organizationsNamespace .Values.authorizationPolicy.organizationsServiceAccount.name }}
{{- $identityOnlyPaths := list }}
{{- range $gatewayPaths }}
{{- if not (has . $terminalProxyPaths) }}
{{- $identityOnlyPaths = append $identityOnlyPaths . }}
{{- end }}
{{- end }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "service-base.fullname" . }}-internal
  labels:
    {{- include "service-base.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "service-base.selectorLabels" . | nindent 6 }}
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - {{ $orchestratorPrincipal | quote }}
      to:
        - operation:
            paths:
              {{ range $orchestratorPaths }}
              - {{ . | quote }}
              {{ end }}
    - from:
        - source:
            notPrincipals:
              {{ range $identityPrincipals }}
              - {{ . | quote }}
              {{ end }}
      to:
        - operation:
            paths:
              {{ range $identityOnlyPaths }}
              - {{ . | quote }}
              {{ end }}
    - from:
        - source:
            notPrincipals:
              {{ range concat $identityPrincipals $terminalProxyPrincipals }}
              - {{ . | quote }}
              {{ end }}
      to:
        - operation:
            paths:
              {{ range $terminalProxyPaths }}
              - {{ . | quote }}
              {{ end }}
    - from:
        - source:
            notPrincipals:
              - {{ $orchestratorPrincipal | quote }}
      when:
        - key: request.headers[x-identity-id]
          notValues:
            - "*"
      to:
        - operation:
            paths:
              {{ range $identityOnlyPaths }}
              - {{ . | quote }}
              {{ end }}
    - from:
        - source:
            notPrincipals:
              {{ range concat (list $orchestratorPrincipal) $terminalProxyPrincipals }}
              - {{ . | quote }}
              {{ end }}
      when:
        - key: request.headers[x-identity-id]
          notValues:
            - "*"
      to:
        - operation:
            paths:
              {{ range $terminalProxyPaths }}
              - {{ . | quote }}
              {{ end }}
    {{- /*
      DeleteOrganizationResources is one step of the organization teardown. It
      carries no identity a permission check could refuse, so who may reach it
      at all is settled here: Organizations alone.
    */}}
    - from:
        - source:
            notPrincipals:
              - {{ $organizationsPrincipal | quote }}
      to:
        - operation:
            paths:
              - "/agynio.api.runners.v1.RunnersService/DeleteOrganizationResources"
{{- end }}
